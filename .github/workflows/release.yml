name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            build-essential \
            git \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype-dev \
            libflac-dev \
            libvorbis-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Build SFML 3.0.2
        run: |
          git clone \
            --depth 1 \
            --branch 3.0.2 \
            https://github.com/SFML/SFML.git \
            sfml

          cmake \
            -S sfml \
            -B sfml/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sfml-3 \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_TEST_SUITE=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_BUILD_AUDIO=OFF \
            -DSFML_BUILD_NETWORK=OFF

          cmake \
            --build sfml/build \
            --parallel 2

          sudo cmake \
            --install sfml/build

      - name: Configure Black Hole
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/sfml-3 \
            -DSFML_STATIC_LIBRARIES=ON

      - name: Build Black Hole
        run: |
          cmake \
            --build build \
            --parallel 2

      - name: Package
        run: |
          mkdir package

          cp build/blackhole package/blackhole

          tar \
            -czf blackhole-linux-x64.tar.gz \
            -C package \
            blackhole

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-linux-x64
          path: blackhole-linux-x64.tar.gz


  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SFML 3.0.2
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/SFML/SFML/releases/download/3.0.2/SFML-3.0.2-Windows.VS2022.x64.zip" `
            -OutFile sfml.zip

          Expand-Archive `
            -Path sfml.zip `
            -DestinationPath .

      - name: Configure Black Hole
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$pwd/SFML-3.0.2"

      - name: Build Black Hole
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            package

          Copy-Item `
            build/Release/blackhole.exe `
            package/blackhole.exe

          Copy-Item `
            "SFML-3.0.2/bin/*.dll" `
            package/

          Compress-Archive `
            -Path package/* `
            -DestinationPath blackhole-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-windows-x64
          path: blackhole-windows-x64.zip


  release:
    name: Create GitHub Release
    needs:
      - linux
      - windows

    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: blackhole-linux-x64
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: blackhole-windows-x64
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
